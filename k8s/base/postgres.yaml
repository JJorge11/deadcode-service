# PostgreSQL en Kubernetes: StatefulSet + disco persistente + Service.
#
# La contraseña viene del Secret "postgres-credentials", que NO está en
# git. Se crea con un comando (ver CLAUDE.md, "Comandos útiles").
#
# Recordatorio: en la nube usaremos un Postgres administrado (RDS); esto
# es para el clúster local.

# --- Service: el nombre fijo "postgres" para llegar a la base ---------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: deadcode
spec:
  selector:
    app: postgres          # envía el tráfico a los pods con esta etiqueta
  ports:
    - port: 5432
      targetPort: 5432
---
# --- StatefulSet: pods con identidad y disco propios -----------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: deadcode
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # Usuario "postgres" de la imagen, no root. OJO: en la variante
        # alpine es el uid 70 (en la de Debian es 999). Verificado con:
        #   docker run --rm --entrypoint sh postgres:17-alpine -c 'grep ^postgres: /etc/passwd'
        # fsGroup hace que el disco montado le pertenezca a ese grupo.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine     # misma versión que en Compose
          ports:
            - containerPort: 5432
          env:
            # Los valores salen del Secret, nunca escritos aquí.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}
            # Los datos en una SUBcarpeta del disco: la raíz de algunos
            # discos trae archivos del sistema (ej. lost+found) y
            # Postgres exige una carpeta vacía.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # "¿Estás listo?": hasta que responda, no recibe tráfico.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
          # "¿Estás vivo?": si falla varias veces seguidas, se reinicia.
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}   # mínimo garantizado
            limits: {memory: 512Mi}                # máximo permitido
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  # Disco persistente: Kubernetes crea un PVC "data-postgres-0" que
  # sobrevive aunque el pod se borre o se mueva.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]   # lo monta un solo nodo a la vez
        resources:
          requests:
            storage: 1Gi
