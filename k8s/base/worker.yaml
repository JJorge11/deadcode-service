# Worker de RQ: toma análisis de la cola de Redis y los ejecuta.
# Misma imagen que la API; solo cambia el comando (igual que en Compose).
#
# ⚠️ TEMPORAL: SANDBOX_MODE=local (ver config.yaml). Analiza en su propio
# pod, sin aislamiento, hasta el paso 5 (sandbox con Jobs de Kubernetes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: deadcode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/jjorge11/deadcode-service:sha-4990c1d
          command: ["python", "-m", "deadcode_service.worker"]
          envFrom:
            - configMapRef:
                name: deadcode-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          resources:
            # Más memoria que la API: descomprime y analiza repos.
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp   # aquí se extraen los repos durante el análisis
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi      # si un análisis llena más, el pod se reinicia
