# Clúster local de Kubernetes con kind ("Kubernetes IN Docker").
# Cada nodo es un contenedor Docker en tu PC.
#
# Crear:  kind create cluster --config k8s/kind-config.yaml
# Borrar: kind delete cluster --name deadcode
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: deadcode

# Configuración del kubelet (el programa que arranca los pods en cada
# nodo), igual para TODOS los nodos.
# podPidsLimit: máximo de procesos+hilos por pod. Sin esto es ilimitado:
# una "fork bomb" en un sandbox (código ajeno) agotaría los PIDs del nodo
# entero y nada más podría arrancar. 1024 = ~7x lo que usa el pod más
# grande hoy (Grafana, ~150). Kubernetes no permite un límite por pod:
# lo ideal sería un nodo solo para sandboxes con un límite menor (nube).
# En un clúster YA creado esto no se aplica solo: ver CLAUDE.md.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    podPidsLimit: 1024

nodes:
  # El "cerebro": decide dónde corre cada pod y vigila que todo esté
  # como se pidió.
  - role: control-plane
    # Puertos que se abren al CREAR el clúster (después no se pueden
    # agregar). 30080 dentro del clúster -> 8080 en tu PC: por ahí
    # llegaremos a la API desde el navegador (http://127.0.0.1:8080).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"   # solo desde tu PC, no desde tu red WiFi
        protocol: TCP

  # Donde corren nuestras aplicaciones (API, worker, Postgres, Redis).
  # OJO: "worker" aquí es un NODO (un computador del clúster), no
  # nuestro worker de RQ. Mismo nombre, conceptos distintos.
  - role: worker
