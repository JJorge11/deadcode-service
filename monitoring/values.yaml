# Valores del chart kube-prometheus-stack (Prometheus + Grafana), COMPARTIDOS
# por kind (argocd/monitoring.yaml) y EKS (argocd/eks/monitoring.yaml).
# En EKS se aplica encima monitoring/values-eks.yaml (solo lo que cambia).
# Antes vivían dentro de argocd/monitoring.yaml ("valuesObject").

# --- Partes de Kubernetes que en kind NO se pueden medir ---------
# Escuchan solo en 127.0.0.1 dentro de su nodo: Prometheus no
# llega y las marcaría "caídas" para siempre (falsas alarmas).
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}

# Alertmanager: RECIBE las alertas que dispara Prometheus, las
# agrupa y las envía (correo, chat...). Sin destino configurado
# aún: se ven en su web y en Grafana. Memoria: límite holgado;
# medir el uso real con Prometheus y ajustar (lección de Grafana).
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}

grafana:
  # Contraseña desde un Secret creado por comando (si no, sería
  # "prom-operator", que sabe todo el mundo).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Su base interna (SQLite) en RAM, no en disco: en kind+WSL2 el
  # disco es lento y cada "migración" del primer arranque tardaba
  # ~1 s (cientos de ellas). No se pierde nada importante: los
  # dashboards y la conexión a Prometheus vienen de ConfigMaps.
  persistence:
    inMemory:
      enabled: true
      sizeLimit: 64Mi
  # "¿Terminaste de arrancar?": hasta 5 min (30 x 10 s). Mientras
  # tanto NO se aplica la livenessProbe, que antes lo mataba a
  # mitad del arranque (reinicios en bucle).
  startupProbe:
    httpGet: {path: /api/health, port: grafana}
    periodSeconds: 10
    failureThreshold: 30
  # Grafana 13 usa ~400-500Mi. Con 256/384Mi moría (OOMKilled) y,
  # justo antes, Linux sacaba su programa de la RAM y lo releía del
  # disco sin parar (18 GB leídos): eso saturó el disco de TODO el
  # clúster (etcd lento -> API caída -> otros pods fallando).
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 768Mi}   # incluye la base en RAM

prometheus:
  prometheusSpec:
    # Encontrar TODOS los ServiceMonitor del clúster (también los
    # de nuestra app, más adelante), no solo los de este chart.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Historia: 7 días o 1,5 GB (lo que llegue primero).
    retention: 7d
    retentionSize: 1500MB
    # Disco propio: reiniciar Prometheus no borra los gráficos.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 2Gi}
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1Gi}
