# Levanta todo el entorno de desarrollo con: docker compose up -d --build
# Las variables ${...} se leen del archivo .env (copiar de .env.example).
# ":?mensaje" hace que Compose falle con ese mensaje si la variable falta.

services:
  # Nuestra API (se construye con el Dockerfile de esta carpeta)
  api:
    build: .
    image: deadcode-service:dev
    ports:
      - "8000:8000"   # puerto_en_tu_PC:puerto_en_el_contenedor
    environment:
      # Dentro de Compose, cada servicio se encuentra por su nombre
      # ("postgres", "redis"), no por "localhost".
      DATABASE_URL: postgresql://${POSTGRES_USER:?falta en .env}:${POSTGRES_PASSWORD:?falta en .env}@postgres:5432/${POSTGRES_DB:?falta en .env}
      REDIS_URL: redis://redis:6379/0
      # La API NO lanza sandboxes: solo lo usa para saber qué ofrecer
      # (en "docker" no hay nivel 2). Debe coincidir con el del worker.
      SANDBOX_MODE: docker
    depends_on:
      # La API arranca solo cuando Postgres y Redis pasan su healthcheck.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker: toma tareas de la cola de Redis y las ejecuta.
  # Misma imagen que la API (mismo código); solo cambia el comando.
  worker:
    build: .
    image: deadcode-service:dev
    command: ["python", "-m", "deadcode_service.worker"]
    environment:
      # El worker escribe el estado y resultado de cada análisis en Postgres.
      DATABASE_URL: postgresql://${POSTGRES_USER:?falta en .env}:${POSTGRES_PASSWORD:?falta en .env}@postgres:5432/${POSTGRES_DB:?falta en .env}
      REDIS_URL: redis://redis:6379/0
      # Cada análisis corre en un contenedor desechable (ver sandbox.py).
      SANDBOX_MODE: docker
      SANDBOX_IMAGE: deadcode-service:dev
      # El worker NO tiene el socket de Docker: habla con el "portero".
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_CONFIG: /tmp/.docker   # el usuario "app" no tiene carpeta personal
    networks:
      - default          # para Postgres, Redis e internet (descargar de GitHub)
      - docker-control   # solo para hablar con el portero
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started

  # "Portero" del socket de Docker. El socket da control TOTAL de Docker
  # (equivale a ser administrador del PC), así que nadie lo recibe
  # directamente: este proxy solo deja pasar operaciones sobre
  # contenedores (crear, iniciar, esperar, borrar) y bloquea el resto
  # (imágenes, volúmenes, redes, info del sistema...).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1   # permitir /containers/...
      POST: 1         # permitir crear/iniciar/borrar (no solo leer)
    volumes:
      # ":ro" NO hace "solo lectura" la API de Docker; lo que limita es
      # el proxy. Solo este contenedor ve el socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-control   # NO está en la red "default": la API no lo ve

  # Base de datos: guardará los resultados de los análisis
  postgres:
    image: postgres:17-alpine   # versión fija: evita sorpresas al actualizar
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta en .env}
    volumes:
      # Los datos viven en un volumen: sobreviven aunque borres el contenedor.
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 = solo accesible desde tu PC, no desde tu red WiFi.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # pg_isready responde OK cuando Postgres acepta conexiones.
      # $$ = "$" literal: la variable la resuelve el contenedor, no Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cola de tareas: la API anota trabajos aquí y los workers los toman
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   # responde "PONG" si está vivo
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

networks:
  # Red privada worker <-> portero. "internal": sin salida a internet.
  docker-control:
    internal: true
