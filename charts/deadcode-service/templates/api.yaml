# API: Service (NodePort) + Deployment.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "deadcode.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "deadcode.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http             # el ServiceMonitor busca el puerto por nombre
      port: 8000
      targetPort: 8000
      nodePort: {{ .Values.api.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "deadcode.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "deadcode.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deadcode.labels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        # Si cambia el ConfigMap, cambia este valor y Kubernetes
        # reinicia los pods para que tomen la nueva configuración.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      # La API no habla con Kubernetes: no recibe credenciales del clúster.
      automountServiceAccountToken: false
      securityContext:
        {{- include "deadcode.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "deadcode.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: deadcode-config
          env:
            {{- include "deadcode.databaseEnv" . | nindent 12 }}
          # "¿Listo?" revisa Postgres y Redis; "¿vivo?" solo el puerto
          # (si revisara Postgres, una caída reiniciaría todas las APIs).
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "deadcode.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
