# ConfigMap: configuración NO secreta de la app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: deadcode-config
  labels:
    {{- include "deadcode.labels" (dict "root" . "component" "config") | nindent 4 }}
data:
  REDIS_URL: redis://redis:6379/0
  SANDBOX_MODE: {{ .Values.sandbox.mode | quote }}
  # Modo "kubernetes": el sandbox usa la MISMA imagen que la app (ya
  # contiene el analizador) y se crea en el namespace aislado.
  SANDBOX_IMAGE: {{ include "deadcode.image" . | quote }}
  SANDBOX_NAMESPACE: {{ .Values.sandbox.namespace | quote }}
