# Redis (solo la COLA; la verdad está en Postgres): Service + Deployment.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "deadcode.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "deadcode.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "deadcode.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "deadcode.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deadcode.labels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false   # no habla con Kubernetes
      securityContext:
        # Usuario "redis" de la imagen alpine: uid 999, grupo 1000.
        runAsUser: 999
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
