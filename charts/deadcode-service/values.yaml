# Valores del chart: TODO lo configurable, en un solo lugar.
# Se pueden cambiar al instalar: helm upgrade ... --set api.replicas=3
#
# ⚠️ Este archivo va en git: NUNCA poner contraseñas aquí.

# Imagen de la app (API y worker). Publicada por el CI en GHCR.
image:
  repository: ghcr.io/jjorge11/deadcode-service
  # Etiqueta INMUTABLE (sha-<commit>), nunca "latest": así se sabe
  # exactamente qué versión corre. La ACTUALIZA EL CI (job "deploy")
  # en cada push a main; ArgoCD despliega ese commit. No editar a mano.
  tag: sha-1cd6e2a
  pullPolicy: IfNotPresent

api:
  replicas: 2              # dos copias: si una cae, la otra sigue
  nodePort: 30080          # kind lo conecta con 127.0.0.1:8080
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}

worker:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
  tmpSizeLimit: 1Gi        # espacio para extraer repos durante el análisis

# "kubernetes" = un pod desechable por análisis, en una zona aislada
# (ver templates/sandbox.yaml). "local" (sin aislamiento) es solo para
# tests y Windows: NUNCA en el clúster.
sandbox:
  mode: kubernetes
  namespace: deadcode-sandboxes   # zona aislada (ver templates/sandbox.yaml)
  maxPods: 4                      # sandboxes simultáneos como máximo
  quotaMemory: 2Gi                # memoria total de todos los sandboxes
  quotaCpu: "4"
  # Grupo de nodos SOLO para sandboxes (etiqueta y taint deadcode/pool=<valor>,
  # ver infra/aws/platform/eks.tf). "" = cualquier nodo (kind).
  nodePool: ""

# Métricas para Prometheus (etapa 6). Requiere kube-prometheus-stack
# instalado (argocd/monitoring.yaml); si no, poner enabled: false.
metrics:
  serviceMonitor:
    enabled: true
    interval: 15s                 # cada cuánto Prometheus lee /metrics
  dashboard:
    enabled: true                 # dashboards/deadcode.json -> Grafana
  alerts:
    enabled: true                 # alerts/deadcode.rules.yaml -> Prometheus

postgres:
  # true = Postgres DENTRO del clúster (kind, StatefulSet de abajo).
  # false = base EXTERNA (RDS en EKS): no se crea nada y la app usa "host".
  enabled: true
  host: postgres               # nombre del Service (o dirección de RDS)
  # SSL hacia la base. "prefer" = usarlo si el servidor lo ofrece (el de
  # kind no). RDS lo EXIGE: "require" en values-eks.yaml.
  sslMode: prefer
  image: postgres:17-alpine
  storage: 1Gi
  # Secret con POSTGRES_USER, POSTGRES_PASSWORD y POSTGRES_DB.
  # NO lo crea el chart: se crea con un comando (ver CLAUDE.md).
  existingSecret: postgres-credentials
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

redis:
  image: redis:8-alpine
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
