[project]
name = "deadcode-service"
version = "0.1.0"
description = "Servicio que detecta código muerto en repositorios públicos combinando análisis estático y cobertura en ejecución"
readme = "README.md"
authors = [
    { name = "Jorge Avendaño", email = "jorgeavendanoflores@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.6",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
    "rq>=3.0.0",
    "uvicorn[standard]>=0.54.0",
    "vulture==2.16",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]   # dónde buscar los tests
pythonpath = ["."]      # permite "from tests.helpers import ..."
addopts = "-v"          # mostrar el nombre de cada test al ejecutarlo
