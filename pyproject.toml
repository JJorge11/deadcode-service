[project]
name = "deadcode-service"
version = "0.1.0"
description = "Servicio que detecta código muerto en repositorios públicos combinando análisis estático y cobertura en ejecución"
readme = "README.md"
authors = [
    { name = "Jorge Avendaño", email = "jorgeavendanoflores@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.6",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
