# CI: GitHub ejecuta esto en una máquina Linux nueva en cada push a
# main y en cada pull request. Resultado: ✅ o ❌ junto al commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimos permisos: el workflow solo necesita LEER el código.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1) Tests con pytest contra Postgres y Redis reales.
  # ------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # si algo se cuelga, cortar a los 10 min

    # Credenciales SOLO de prueba: esta base vive unos minutos dentro
    # de la máquina de CI y no es accesible desde fuera.
    env:
      POSTGRES_USER: deadcode
      POSTGRES_PASSWORD: ci-solo-pruebas
      POSTGRES_DB: deadcode

    # "Service containers": contenedores Docker que GitHub levanta
    # junto al job. Mismas imágenes que en docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deadcode
          POSTGRES_PASSWORD: ci-solo-pruebas
          POSTGRES_DB: deadcode
        ports:
          - 5432:5432
        # Esperar a que Postgres acepte conexiones antes de seguir.
        options: >-
          --health-cmd "pg_isready -U deadcode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar uv (misma versión que en local)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"

      - name: Instalar dependencias
        # --locked: falla si uv.lock no coincide con pyproject.toml
        # (alguien olvidó actualizar el lockfile).
        run: uv sync --locked

      - name: Ejecutar tests
        run: uv run pytest

  # ------------------------------------------------------------------
  # 2) ¿Se puede construir la imagen? ¿Compose es válido?
  # ------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build -t deadcode-service:ci .

      - name: Validar docker-compose.yml
        # Compose necesita las variables del .env (que no está en git).
        env:
          POSTGRES_USER: deadcode
          POSTGRES_PASSWORD: ci-solo-pruebas
          POSTGRES_DB: deadcode
        run: docker compose config --quiet
