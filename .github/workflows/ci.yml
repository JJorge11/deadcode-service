# CI: GitHub ejecuta esto en una máquina Linux nueva en cada push a
# main y en cada pull request. Resultado: ✅ o ❌ junto al commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimos permisos: el workflow solo necesita LEER el código.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1) Tests con pytest contra Postgres y Redis reales.
  # ------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # si algo se cuelga, cortar a los 10 min

    # Credenciales SOLO de prueba: esta base vive unos minutos dentro
    # de la máquina de CI y no es accesible desde fuera.
    env:
      POSTGRES_USER: deadcode
      POSTGRES_PASSWORD: ci-solo-pruebas
      POSTGRES_DB: deadcode

    # "Service containers": contenedores Docker que GitHub levanta
    # junto al job. Mismas imágenes que en docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deadcode
          POSTGRES_PASSWORD: ci-solo-pruebas
          POSTGRES_DB: deadcode
        ports:
          - 5432:5432
        # Esperar a que Postgres acepte conexiones antes de seguir.
        options: >-
          --health-cmd "pg_isready -U deadcode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar uv (misma versión que en local)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"

      - name: Instalar dependencias
        # --locked: falla si uv.lock no coincide con pyproject.toml
        # (alguien olvidó actualizar el lockfile).
        run: uv sync --locked

      - name: Ejecutar tests
        run: uv run pytest

  # ------------------------------------------------------------------
  # 2) ¿Se puede construir la imagen? ¿Compose es válido?
  # ------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Buildx: el constructor moderno de Docker. Permite guardar la
      # caché de capas entre ejecuciones de CI (type=gha).
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar docker-compose.yml
        # Compose necesita las variables del .env (que no está en git).
        env:
          POSTGRES_USER: deadcode
          POSTGRES_PASSWORD: ci-solo-pruebas
          POSTGRES_DB: deadcode
        run: docker compose config --quiet

  # ------------------------------------------------------------------
  # 3) ¿El chart de Helm es válido?
  # ------------------------------------------------------------------
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Helm (misma versión que en local)
        uses: azure/setup-helm@v5
        with:
          version: v4.3.2

      # lint: busca errores y malas prácticas en el chart.
      - name: Revisar el chart (helm lint)
        run: helm lint charts/deadcode-service --strict

      # template: genera el YAML final (sin un clúster). Si una plantilla
      # está rota, falla aquí y no al desplegar.
      - name: Generar el YAML (helm template)
        run: helm template deadcode charts/deadcode-service -n deadcode > /dev/null

  # ------------------------------------------------------------------
  # 4) Publicar la imagen en GHCR (GitHub Container Registry).
  #    Solo si los dos jobs anteriores pasaron y solo en push a main
  #    (un pull request no debe generar una imagen "oficial").
  # ------------------------------------------------------------------
  publish:
    needs: [tests, docker-build, helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Único job con permiso de escribir paquetes (subir imágenes).
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN: token temporal que GitHub crea para esta ejecución
      # y que vence al terminar. No hay contraseñas guardadas.
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcula el nombre y las etiquetas de la imagen:
      #   ghcr.io/<usuario>/deadcode-service:sha-<commit>  (inmutable)
      #   ghcr.io/<usuario>/deadcode-service:latest        (la más nueva)
      # También agrega etiquetas OCI (metadatos), entre ellas el enlace
      # al repo, para que GHCR asocie la imagen con este repositorio.
      - name: Calcular nombre y etiquetas
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ------------------------------------------------------------------
  # 5) Desplegar (GitOps): escribir la nueva etiqueta en values.yaml y
  #    hacer commit. ArgoCD ve el commit y actualiza el clúster.
  #    El CI NO toca el clúster: solo cambia git.
  # ------------------------------------------------------------------
  deploy:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Único job que puede escribir en el repo (hacer commit).
    permissions:
      contents: write

    # Nunca dos "deploy" a la vez (evita commits que choquen).
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Descargar el código (rama main)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Escribir la nueva etiqueta en values.yaml
        run: |
          TAG="sha-${GITHUB_SHA::7}"   # la misma que calculó "publish"
          sed -i -E "s/^  tag: sha-[0-9a-f]+$/  tag: ${TAG}/" charts/deadcode-service/values.yaml
          # Si la línea no existe (alguien cambió el formato), fallar.
          grep -qx "  tag: ${TAG}" charts/deadcode-service/values.yaml
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      # Los commits hechos con GITHUB_TOKEN NO disparan otro workflow:
      # así este commit no vuelve a lanzar el CI (sin bucle infinito).
      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "values.yaml ya tenía ${TAG}: nada que hacer"
            exit 0
          fi
          git commit -am "Despliega la imagen ${TAG}"
          # Si alguien hizo push mientras tanto, ponerse al día primero.
          git pull --rebase origin main
          git push origin main
